name: build

on:
  # Restricted like build.yml, so a PR commit builds once.
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "logo/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "logo/**"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# TODO: Add deploy if needed
jobs:
  native:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    strategy:
      matrix:
        include:
          - os: windows-2022
            name: windows
            static: false
    runs-on: ${{ matrix.os }}
    env:
      LEIN_ROOT: "true"
      GRAALVM_VERSION: "25.0.4"
      BABASHKA_PLATFORM: ${{ matrix.name }} # used in release script
      BABASHKA_TEST_ENV: native
      GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      BABASHKA_SHA: ${{ github.sha }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 1
          submodules: 'true'

      - name: Cache deps
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Setup GraalVM
        if: "matrix.static == false"
        uses: graalvm/setup-graalvm@v1.3.3
        with:
          java-version: '25.0.4'
          distribution: 'graalvm'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest
          # lein: latest -- skipped because this uses some PS bullshit

      - name: Babashka version
        id: babashka-version
        shell: bash
        run: |
          BABASHKA_VERSION=$(cat resources/BABASHKA_VERSION)
          echo "##[set-output name=version;]${BABASHKA_VERSION}"

      - name: Install libffi
        shell: cmd
        run: |
              call script\setup-libffi.bat > libffi-path.txt
              if errorlevel 1 exit /B 1
              set /P LIBFFI_LIB=< libffi-path.txt
              echo BABASHKA_LIBFFI=%LIBFFI_LIB%>> %GITHUB_ENV%

      - name: Build
        shell: cmd
        run: |
              powershell -Command "(New-Object Net.WebClient).DownloadFile('https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein.bat', 'lein.bat')"
              call lein self-install

              set GRAALVM_HOME=%JAVA_HOME%

              rem ordered FFI shapes: the Win64 ABI assigns registers by position
              call bb script\gen_ffi_metadata.clj windows

              call script/uberjar.bat

              call script/compile.bat

              echo Creating zip archive

              set zip=babashka-%BABASHKA_VERSION%-windows-amd64.zip

              jar -cMf %zip% bb.exe

              bb --config .build/bb.edn --deps-root . release-artifact %zip%

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: bb.exe
          name: babashka-${{ steps.babashka-version.outputs.version }}-${{ matrix.name }}-amd64

      - name: Test Windows encoding
        shell: pwsh
        run: |
          ./bb.exe --prn test-resources/unicode_test.clj
          $OutputEncoding = [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          ./bb.exe --prn test-resources/unicode_test.clj

      - name: Test binary and libs
        shell: cmd
        run: |
          set BABASHKA_CLASSPATH=
          set BABASHKA_TEST_ENV=native
          rem The struct tests build a small C library, so cl has to be on
          rem PATH. native-image finds MSVC by itself and does not put it
          rem there, so ask vswhere the way native-image does.
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          if defined VSPATH call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          call script/test.bat :windows || exit /B 1
          call script/run_lib_tests.bat || exit /B 1
